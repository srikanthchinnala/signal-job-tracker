name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate
        run: |
          node --check app.js
          node --check sw.js
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest ok')"

      - name: Build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq librsvg2-bin
          mkdir -p dist/icons
          cp index.html styles.css app.js sw.js manifest.webmanifest dist/
          cp icons/icon.svg dist/icons/
          rsvg-convert -w 192 -h 192 icons/icon.svg -o dist/icons/icon-192.png
          rsvg-convert -w 512 -h 512 icons/icon.svg -o dist/icons/icon-512.png
          # Version the service-worker cache with the commit SHA
          sed -i "s/__BUILD__/${GITHUB_SHA::7}/" dist/sw.js
          ls -R dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
